stages:
  - build
  - test
  - package

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_TYPE: Release

image: gcc:13

build:linux:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake python3 python3-pip
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
  artifacts:
    paths:
      - build/nadir
      - build/

test:linux:
  stage: test
  dependencies:
    - build:linux
  before_script:
    - apt-get update && apt-get install -y python3
  script:
    - python3 test_runner.py
    - ./build/nadir --init test_repos/apex-recipes

package:dist:
  stage: package
  dependencies:
    - build:linux
  script:
    - cpack --config build/CPackConfig.cmake -C Release -B dist
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
