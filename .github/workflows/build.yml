name: Nadir CI & Packaging

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release

      - name: Run Salesforce Test Suite
        run: python test_runner.py

      - name: Run SFDX Project Initialization Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./build/Release/nadir.exe --init test_repos/apex-recipes
          else
            ./build/nadir --init test_repos/apex-recipes
          fi

      - name: Package with CPack
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - name: Upload distributable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadir-${{ matrix.os }}
          path: dist/nadir-*

      - name: Upload binary executable
        uses: actions/upload-artifact@v4
        with:
          name: nadir-bin-${{ matrix.os }}
          path: |
            build/nadir
            build/Release/nadir.exe
            build/nadir.exe

  publish-npm:
    name: Publish to GitHub Packages
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: nadir-bin-ubuntu-latest
          path: npm/bin/artifacts/ubuntu

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: nadir-bin-macos-latest
          path: npm/bin/artifacts/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: nadir-bin-windows-latest
          path: npm/bin/artifacts/windows

      - name: Stage platform binaries for npm
        shell: bash
        run: |
          mkdir -p npm/bin
          cp npm/bin/artifacts/ubuntu/nadir npm/bin/nadir-linux-x64 || true
          cp npm/bin/artifacts/macos/nadir npm/bin/nadir-darwin-arm64 || true
          cp npm/bin/artifacts/macos/nadir npm/bin/nadir-darwin-x64 || true
          if [ -f npm/bin/artifacts/windows/Release/nadir.exe ]; then
            cp npm/bin/artifacts/windows/Release/nadir.exe npm/bin/nadir-win32-x64.exe
          elif [ -f npm/bin/artifacts/windows/nadir.exe ]; then
            cp npm/bin/artifacts/windows/nadir.exe npm/bin/nadir-win32-x64.exe
          fi
          chmod +x npm/bin/nadir-* npm/bin/nadir.js || true
          rm -rf npm/bin/artifacts
          ls -la npm/bin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesezraseitenschlag'

      - name: Publish to GitHub Packages
        run: |
          cd npm
          npm publish || echo "Package already published or not ready"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
