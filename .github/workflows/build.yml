name: Nadir CI & Packaging

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release

      - name: Run Salesforce Test Suite
        run: python test_runner.py

      - name: Run SFDX Project Initialization Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./build/Release/nadir.exe --init test_repos/apex-recipes
          else
            ./build/nadir --init test_repos/apex-recipes
          fi

      - name: Package with CPack
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - name: Upload distributable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadir-${{ matrix.os }}
          path: dist/nadir-*
